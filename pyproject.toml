[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "popup-notebook"
version = "0.1.0"
description = "Terminal-native, notebook-like Python scratchpad for tmux workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jonathan Kim" },
]
dependencies = [
  "ipykernel>=6.29.0",
  "jupyter_client>=8.6.0",
  "rich>=13.7.0",
  "textual>=0.57.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
]

[project.scripts]
popup-notebook = "popup_notebook.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/popup_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
