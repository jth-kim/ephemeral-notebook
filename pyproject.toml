[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ephemeral-notebook"
version = "0.1.0"
description = "Terminal-native, notebook-like Python scratchpad for tmux workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Jonathan Kim" },
]
keywords = [
  "notebook",
  "terminal",
  "tmux",
  "python",
  "repl",
  "scratchpad",
  "jupyter",
  "textual",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "ipykernel>=6.29.0",
  "jupyter_client>=8.6.0",
  "rich>=13.7.0",
  "textual[syntax]>=0.57.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/jonathankim/ephemeral-notebook"
Repository = "https://github.com/jonathankim/ephemeral-notebook"
Issues = "https://github.com/jonathankim/ephemeral-notebook/issues"

[project.scripts]
ephemeral-notebook = "ephemeral_notebook.cli:app"
en = "ephemeral_notebook.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ephemeral_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
